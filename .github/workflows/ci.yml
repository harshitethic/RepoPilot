name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install backend and smoke-test dependencies
        run: python -m pip install -r backend/requirements-test.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Test repository import boundaries
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test health response compatibility
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python for isolated real FastAPI backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node for real React frontend
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend HTTP dependencies
        run: python -m pip install -r backend/requirements-test.txt

      - name: Install frontend and browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser test with real ZIP import, search and delayed response
        working-directory: frontend
        env:
          CI: "true"
          REPOPILOT_PYTHON: python
        run: npm run test:e2e

      - name: Upload browser failures for review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-debug-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
